name: Bump Homebrew Formula

# Toolchain releases are cut by hand, from a machine that can build the
# archive. This is the part that follows: the tap pins a url and a checksum,
# so `brew upgrade` shows a release only once the formula names it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump the formula to, e.g. v0.0.2'
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # `vscode-v*` releases fire this same event and have nothing to do
          # with the toolchain.
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a toolchain release; nothing to bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG is a prerelease; the tap tracks stable releases only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Take each checksum from the archive itself
        id: archive
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # One archive per platform and the formula pins both, so a release
          # missing either fails the run rather than leaving Apple Silicon on
          # the Intel build or the formula quietly a version behind. A release
          # is cut one machine at a time, so the second archive lands after the
          # release is published: re-run this workflow once it has.
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            archive="cronyx-$TAG-$target.tar.gz"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$archive" -p "$archive.sha256" -D dl

            published=$(awk '{print $1}' "dl/$archive.sha256")
            actual=$(sha256sum "dl/$archive" | awk '{print $1}')
            [ "$published" = "$actual" ] || {
              echo "::error::$archive hashes to $actual, but its .sha256 asset says $published"
              exit 1
            }

            case "$target" in
              aarch64-*) slot=arm ;;
              *)         slot=intel ;;
            esac
            echo "${slot}_archive=$archive" >> "$GITHUB_OUTPUT"
            echo "${slot}_sha256=$actual" >> "$GITHUB_OUTPUT"
          done

      - name: Check out the tap
        if: steps.tag.outputs.skip == 'false'
        uses: actions/checkout@v5
        with:
          repository: brendancron/homebrew-cronyx
          # A cross-repository push, which the run's own token cannot do. A
          # deploy key rather than a personal token: it reaches that one
          # repository and it does not expire, which a token did, silently,
          # between one release and the next.
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap

      - name: Point the formula at the release
        if: steps.tag.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          ARM_ARCHIVE: ${{ steps.archive.outputs.arm_archive }}
          ARM_SHA256: ${{ steps.archive.outputs.arm_sha256 }}
          INTEL_ARCHIVE: ${{ steps.archive.outputs.intel_archive }}
          INTEL_SHA256: ${{ steps.archive.outputs.intel_sha256 }}
        run: |
          # A url is found by the platform triple it already names rather than
          # by where it sits, so the formula keeps whatever nesting it uses to
          # tell the two apart. Its checksum is the line under it.
          python3 - <<'PY'
          import os, re, sys

          path = "tap/Formula/cronyx.rb"
          text = open(path).read()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}"

          text, count = re.subn(
              r'^(\s*)version ".*"$',
              lambda m: f"{m.group(1)}version \"{os.environ['VERSION']}\"",
              text,
              flags=re.M,
          )
          if count != 1:
              sys.exit(f"::error::expected one version line, found {count}")

          for triple, archive, sha in [
              ("aarch64-apple-darwin", os.environ["ARM_ARCHIVE"], os.environ["ARM_SHA256"]),
              ("x86_64-apple-darwin", os.environ["INTEL_ARCHIVE"], os.environ["INTEL_SHA256"]),
          ]:
              pattern = (
                  r'^(\s*)url ".*' + re.escape(triple) + r'.*"\n\s*sha256 ".*"$'
              )
              text, count = re.subn(
                  pattern,
                  lambda m: f'{m.group(1)}url "{base}/{archive}"\n{m.group(1)}sha256 "{sha}"',
                  text,
                  flags=re.M,
              )
              if count != 1:
                  sys.exit(f"::error::expected one {triple} url, found {count}")

          open(path, "w").write(text)
          PY

          grep -q "version \"$VERSION\"" tap/Formula/cronyx.rb || { echo "::error::the version did not take"; exit 1; }
          grep -q "sha256 \"$ARM_SHA256\"" tap/Formula/cronyx.rb || { echo "::error::the arm64 checksum did not take"; exit 1; }
          grep -q "sha256 \"$INTEL_SHA256\"" tap/Formula/cronyx.rb || { echo "::error::the x86_64 checksum did not take"; exit 1; }

      - name: Push it
        if: steps.tag.outputs.skip == 'false'
        working-directory: tap
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "The formula already names $VERSION."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "cronyx $VERSION"
          git push

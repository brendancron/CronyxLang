name: Bump Homebrew Formula

# Toolchain releases are cut by hand, from a machine that can build the
# archive. This is the part that follows: the tap pins a url and a checksum,
# so `brew upgrade` shows a release only once the formula names it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bump the formula to, e.g. v0.0.2'
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # `vscode-v*` releases fire this same event and have nothing to do
          # with the toolchain.
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a toolchain release; nothing to bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG is a prerelease; the tap tracks stable releases only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # For `targets.json`, which says which platforms the formula carries. At
      # the tag, so a release is bumped against the targets it was built for.
      - uses: actions/checkout@v5
        if: steps.tag.outputs.skip == 'false'
        with:
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Take each checksum from the archive itself
        id: archive
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          # An architecture the release does not carry is left where it is
          # rather than pointed at a file that is not there: the formula names
          # a version per architecture, so Apple Silicon moving does not wait
          # on an Intel archive that may never be built.
          #
          # A release carrying none of them is expected when this runs on the
          # `release` event: the archives are built after publishing, and
          # release-archives.yml runs this again once they are uploaded. Run
          # by hand, carrying none is a mistake worth failing over.
          found=false
          echo "[]" > archives.json

          while read -r target format; do
            archive="cronyx-$TAG-$target.$format"

            if ! gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                 -p "$archive" -p "$archive.sha256" -D dl 2>/dev/null; then
              echo "$TAG carries no $target archive; leaving that block alone."
              continue
            fi

            published=$(awk '{print $1}' "dl/$archive.sha256")
            actual=$(sha256sum "dl/$archive" | awk '{print $1}')
            [ "$published" = "$actual" ] || {
              echo "::error::$archive hashes to $actual, but its .sha256 asset says $published"
              exit 1
            }

            found=true
            python3 - "$target" "$archive" "$actual" <<'PY'
          import json, sys
          rows = json.load(open("archives.json"))
          rows.append({"triple": sys.argv[1], "archive": sys.argv[2], "sha256": sys.argv[3]})
          json.dump(rows, open("archives.json", "w"))
          PY
          done < <(python3 -c '
          import json
          for t in json.load(open("source/targets.json")):
              if "homebrew" in t["channels"]:
                  print(t["triple"], t["format"])
          ')

          if ! $found; then
            if [ "$EVENT" = "release" ]; then
              echo "$TAG has no archive yet; release-archives.yml runs this again once they are uploaded."
              echo "none=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$TAG carries no archive the formula wants"
            exit 1
          fi

      - name: Check out the tap
        if: steps.tag.outputs.skip == 'false' && steps.archive.outputs.none != 'true'
        uses: actions/checkout@v5
        with:
          repository: brendancron/homebrew-cronyx
          # A cross-repository push, which the run's own token cannot do. A
          # deploy key rather than a personal token: it reaches that one
          # repository and it does not expire, which a token did, silently,
          # between one release and the next.
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap

      - name: Point the formula at the release
        if: steps.tag.outputs.skip == 'false' && steps.archive.outputs.none != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The version lives inside each architecture's block rather than once
          # at the top, so an architecture with no archive in this release stays
          # on the last one that had it. A block is found by the platform triple
          # its url already names, and holds its version, that url and its
          # checksum, in that order.
          python3 - <<'PY'
          import json, os, re, sys

          path = "tap/Formula/cronyx.rb"
          text = open(path).read()
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['TAG']}"
          version = os.environ["VERSION"]

          for row in json.load(open("archives.json")):
              triple, archive, sha = row["triple"], row["archive"], row["sha256"]
              pattern = (
                  r'^(\s*)version "[^"]*"\n'
                  r'\s*url "[^"]*' + re.escape(triple) + r'[^"]*"\n'
                  r'\s*sha256 "[^"]*"$'
              )
              replacement = (
                  lambda m: f'{m.group(1)}version "{version}"\n'
                            f'{m.group(1)}url "{base}/{archive}"\n'
                            f'{m.group(1)}sha256 "{sha}"'
              )
              text, count = re.subn(pattern, replacement, text, flags=re.M)
              # A target the formula has no block for is not an error: a
              # platform can be built and published before the tap carries it.
              if count == 0:
                  print(f"the formula has no {triple} block; skipping it")
              elif count > 1:
                  sys.exit(f"::error::expected one {triple} block, found {count}")
              else:
                  print(f"{triple} -> {version}")

          open(path, "w").write(text)
          PY

          python3 - <<'PY'
          import json
          formula = open("tap/Formula/cronyx.rb").read()
          for row in json.load(open("archives.json")):
              if f'sha256 "{row["sha256"]}"' not in formula:
                  print(f'{row["triple"]}: its checksum did not take (no block for it?)')
          PY

      - name: Push it
        if: steps.tag.outputs.skip == 'false' && steps.archive.outputs.none != 'true'
        working-directory: tap
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "The formula already names $VERSION."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "cronyx $VERSION"
          git push

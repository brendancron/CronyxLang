name: Release Archives

# An OCaml binary is native and there is no cross-compilation worth the
# trouble, so each archive is built on a machine of that architecture.
# `scripts/release.sh` cuts the release from whatever machine it is run on;
# this adds the ones that machine cannot produce.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for, e.g. v0.0.10'
        required: true

jobs:
  # `targets.json` is the one place a platform is written down; a matrix cannot
  # read a file, so a job reads it and hands it over.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      skip: ${{ steps.tag.outputs.skip }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # `vscode-v*` releases fire this same event and have nothing to do
          # with the toolchain.
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a toolchain release; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "$TAG is a prerelease; the tap tracks stable releases only."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.tag.outputs.skip == 'false'
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Hand the targets to the matrix
        id: read
        if: steps.tag.outputs.skip == 'false'
        run: |
          echo "matrix=$(jq -c '{include: .}' targets.json)" >> "$GITHUB_OUTPUT"

  archive:
    needs: targets
    if: needs.targets.outputs.skip == 'false'
    strategy:
      # One archive failing should not take the others down with it: an
      # architecture that built is still worth uploading.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      # The tag, not the branch: the archive has to be the commit the release
      # points at. The fixtures live at the repo root and the harness finds them
      # by walking up from the test binary, so the whole tree is checked out.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.targets.outputs.tag }}

      # A musl archive is built inside Alpine, which cannot host the JavaScript
      # actions above -- they need glibc for their Node runtime -- so the
      # container is entered here rather than declared on the job.
      - name: Build and package, against musl
        if: matrix.musl != ''
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          TARGET: ${{ matrix.triple }}
          UNAME_S: ${{ matrix.uname_s }}
          UNAME_M: ${{ matrix.uname_m }}
          FORMAT: ${{ matrix.format }}
          LINK_FLAGS: ${{ matrix.link_flags }}
          IMAGE: ${{ matrix.musl }}
        run: |
          # As root, against the switch the image already carries: the image
          # runs as `opam`, which does not own a tree the runner checked out.
          # The image pins its opam repository to a local clone taken when the
          # image was built, so `opam update` there finds nothing and `dune`
          # resolves to whatever was current then -- older than this project
          # needs. Pointing `default` at the real remote is what gets a dune
          # new enough to read `(lang dune 3.24)`.
          docker run --rm -v "$PWD:/src" -w /src --user root \
            -e TAG -e VERSION -e TARGET -e UNAME_S -e UNAME_M -e FORMAT \
            -e CRONYX_LINK_FLAGS="$LINK_FLAGS" \
            -e OPAMROOT=/home/opam/.opam \
            "$IMAGE" sh -euc '
              apk add --no-cache build-base bash tar
              git config --global --add safe.directory "*"
              opam repository set-url default https://opam.ocaml.org --yes
              opam install dune --yes
              eval "$(opam env)"
              dune build --release
              bash scripts/package.sh
            '

      - name: Install OCaml
        if: matrix.musl == ''
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true
          opam-pin: false

      - name: Install dependencies
        if: matrix.musl == ''
        shell: bash
        working-directory: bootstrap
        run: opam install . --deps-only --with-test --yes

      # `windows-latest` defaults to PowerShell, which does not read any of
      # this.
      - name: Test
        if: matrix.musl == ''
        shell: bash
        run: |
          (cd bootstrap && opam exec -- dune test)
          opam exec -- dune test cx
          opam exec -- ./scripts/cx-parity.sh

      - name: Build
        if: matrix.musl == ''
        shell: bash
        run: opam exec -- dune build --release

      - name: Package
        if: matrix.musl == ''
        shell: bash
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          TARGET: ${{ matrix.triple }}
          UNAME_S: ${{ matrix.uname_s }}
          UNAME_M: ${{ matrix.uname_m }}
          FORMAT: ${{ matrix.format }}
        run: ./scripts/package.sh

      - name: Publish it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.targets.outputs.tag }}
        run: |
          archive=$(cat archive-path)
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber

  # The formula names a version per architecture, so the tap is worth bumping
  # for whichever archives landed — an architecture whose runner never came
  # free keeps the release it already had. Its own run fired when the release
  # was published, before any of them existed.
  tap:
    needs: [targets, archive]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Hand the tag to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 0
          gh workflow run bump-homebrew.yml -f tag="$TAG"

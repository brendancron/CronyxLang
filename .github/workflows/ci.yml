name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both jobs only read the tree. The repository's default is read-only too, but
# that is a setting someone can change, and a build running `opam install`
# executes third-party scripts -- so the ceiling is declared here rather than
# inherited.
permissions:
  contents: read

jobs:
  # The name is what the main branch ruleset requires as a status check, so it
  # is not free to change with what the job happens to run.
  test:
    runs-on: ubuntu-latest

    steps:
      # The fixtures live at the repo root and the harness finds them by walking
      # up from the test binary, so the whole tree has to be checked out.
      - uses: actions/checkout@v5

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true
          opam-pin: false

      - name: Install dependencies
        working-directory: bootstrap
        run: opam install . --deps-only --with-test --yes

      - name: Build
        working-directory: bootstrap
        run: opam exec -- dune build

      - name: Test
        working-directory: bootstrap
        run: opam exec -- dune test

      - name: Test cx
        run: opam exec -- dune test cx

      # `cx` links the compiler as a library, so the two drivers must not drift.
      # The script builds the whole workspace, which is what covers `cx/`.
      - name: cx parity
        run: opam exec -- bash ./scripts/cx-parity.sh

  # Windows was exercised only at release time, which made cutting a release the
  # only way to find out whether a fix for it worked. The main branch ruleset
  # requires the check named `test`, so this is a job of its own rather than a
  # matrix over that one -- it reports, and it does not gate.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true
          opam-pin: false

      # `windows-latest` defaults to PowerShell, which reads none of this.
      - name: Install dependencies
        shell: bash
        working-directory: bootstrap
        run: opam install . --deps-only --with-test --yes

      - name: Build
        shell: bash
        working-directory: bootstrap
        run: opam exec -- dune build

      - name: Test
        shell: bash
        run: |
          (cd bootstrap && opam exec -- dune test)
          opam exec -- dune test cx
          opam exec -- bash ./scripts/cx-parity.sh

